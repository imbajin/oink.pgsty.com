name: Browser quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: stable
  HUGO_VERSION: latest
  NODE_VERSION: 24
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache
  GOMODCACHE:
    ${{ github.workspace }}/.hugo_cache/modules/filecache/modules/pkg/mod

jobs:
  # One matrix entry per Playwright suite. The `name` values are the published
  # check names, so they must stay stable for branch protection.
  browser:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Axe WCAG AA
            target: test:a11y
            artifact: axe
          - name: Responsive shell and mobile menu
            target: test:responsive-shell
            artifact: responsive-shell
          - name: Content components
            target: test:content-components
            artifact: content-components
          - name: Enhanced code blocks
            target: test:code-blocks
            artifact: code-blocks
          - name: Keyboard navigation
            target: test:keyboard-nav
            artifact: keyboard-nav
          - name: PRD5 scenarios
            target: test:prd5
            artifact: prd5
          - name: Section theme colour
            target: test:theme-color
            artifact: theme-color
          - name: Community feedback regressions
            target: test:community-feedback
            artifact: community-feedback
          - name: Visual presets and appearance controls
            target: test:appearance
            artifact: appearance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Install Dart Sass 1.105.2
        shell: bash
        run: |
          sass_archive="$RUNNER_TEMP/dart-sass-1.105.2-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$sass_archive" \
            https://github.com/sass/dart-sass/releases/download/1.105.2/dart-sass-1.105.2-linux-x64.tar.gz
          echo "a530ee08d5792c80bdb9d9614b45fb58219c890cb42a280a80775f0af9c29582  $sass_archive" | sha256sum --check
          tar --extract --gzip --file "$sass_archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Record build tool versions
        run: |
          go version
          hugo version
          sass --version

      - name: Download Hugo module
        run: go mod download github.com/pgsty/oink
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.suite.target }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.suite.artifact }}-playwright-report
          path: tmp/playwright-report
          if-no-files-found: ignore
